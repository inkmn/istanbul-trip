<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Истанбул + Каппадоки, 8 эмэгтэйн аялал, 2026.10.13–19: өдөр бүрийн хөтөлбөр, газрын зураг, тээвэр, хоол, төсөв, агаарын бөмбөлөг.">
<title>Истанбул 8</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec;--card:#ffffff;--ink:#1b1f26;--mute:#5d6572;--line:#e4e0d8;
  --navy:#0f2a44;--teal:#1f7a8c;--gold:#c8962e;--red:#b23a48;--green:#2e7d5b;
  --sea:#e6f1f5;--shadow:0 2px 12px rgba(20,30,50,.08);--r:16px;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){ --bg:#0f141b;--card:#171e27;--ink:#edf0f3;--mute:#9aa5b3;--line:#2a333f;--sea:#15232c;--shadow:0 2px 12px rgba(0,0,0,.4);--navy:#1b3a5c; } }
:root[data-theme="dark"]{ --bg:#0f141b;--card:#171e27;--ink:#edf0f3;--mute:#9aa5b3;--line:#2a333f;--sea:#15232c;--shadow:0 2px 12px rgba(0,0,0,.4);--navy:#1b3a5c; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + var(--sab));overflow-x:hidden}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:var(--teal)}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top h1{font-size:17px;font-weight:700}
.top small{display:block;font-size:12px;opacity:.75;font-weight:500}
.top .ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;margin-left:6px}
/* sections */
.view{display:none;animation:fade .2s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:12px 0}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:15px;margin:10px 0 4px}
.sub{color:var(--mute);font-size:14px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin:12px 0;aspect-ratio:16/10;background:var(--sea)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.hero .cap h2{font-size:22px;font-weight:800}
.hero .cap p{margin:4px 0 0;font-size:14px;opacity:.9}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip small{display:block;font-size:11px;font-weight:500;opacity:.7}
/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:var(--sea);box-shadow:var(--shadow)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tile:active img{transform:scale(1.04)}
.tile .t{position:absolute;inset:auto 0 0 0;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:13px;font-weight:700;line-height:1.25}
.tile .t small{display:block;font-weight:500;opacity:.85;font-size:11px}
.tile .b{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 7px;border-radius:8px}
/* list rows */
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 64px}
.row .n{font-weight:700;font-size:15px}
.row .d{font-size:13px;color:var(--mute)}
/* day timeline */
.day-head{display:flex;gap:12px;align-items:flex-end;margin:8px 0 4px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.slot:last-child{border-bottom:0}
.slot .tm{font-weight:800;font-size:15px;color:var(--teal);padding-top:2px}
.slot .tm.now{color:var(--red)}
.slot .tt{font-weight:700;font-size:16px}
.slot .cost{display:inline-block;background:var(--sea);color:var(--teal);font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:middle}
.slot .tx{font-size:14px;color:var(--ink);margin-top:4px}
.slot .tx small{color:var(--mute)}
.slot .pl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;margin-right:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.slot .pl img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.slot.now-slot{background:linear-gradient(90deg,rgba(178,58,72,.08),transparent);margin:0 -16px;padding:12px 16px}
details{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
details summary{cursor:pointer;padding:9px 0;font-size:14px;font-weight:700;color:var(--teal);list-style:none;display:flex;align-items:center;gap:6px}
details summary::before{content:"▸";font-size:12px;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
details ol{margin:0 0 10px;padding-left:20px;font-size:14px}
details li{margin:4px 0}
details li i{color:var(--mute);font-style:normal;font-size:13px}
details .alt{font-size:13px;color:var(--mute);margin:0 0 10px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(16px + var(--sab));max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.sheet .pic{aspect-ratio:16/10;margin:10px 16px 0;border-radius:14px;overflow:hidden;background:var(--sea);position:relative}
.sheet .pic img{width:100%;height:100%;object-fit:cover}
.sheet .pic .cat{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 9px;border-radius:9px}
.sheet .body{padding:12px 16px 0}
.sheet h2{font-size:21px;font-weight:800}
.sheet .tr{color:var(--mute);font-size:14px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0;background:var(--bg);border-radius:12px;padding:10px 12px}
.kv b{color:var(--mute);font-weight:600}
.sheet p{font-size:15px;margin:8px 0}
.sheet ul{padding-left:18px;font-size:14px;margin:6px 0}
.sheet li{margin:4px 0}
.btns{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:12px;border:0;font-weight:700;font-size:14px;text-decoration:none;color:#fff;background:var(--teal);min-width:120px}
.btn.alt{background:var(--navy)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.close{position:absolute;top:18px;right:24px;background:rgba(0,0,0,.5);color:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:18px;z-index:2}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;line-height:1}
.nav button.on{color:var(--teal)}
/* weather */
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;font-size:11px}
.wx div{background:var(--bg);border-radius:10px;padding:5px 1px;overflow:hidden}
.wx .d{font-weight:700}
.wx .i{font-size:20px;margin:2px 0}
.wx .t{font-weight:700}
.wx .p{color:var(--mute);font-size:11px}
.wx div.today{outline:2px solid var(--teal)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--navy)}
:root[data-theme="dark"] .stat b{color:#fff}
.stat span{font-size:12px;color:var(--mute)}
/* map */
#mapEl{height:calc(100vh - 64px - 150px - var(--sab) - var(--sat));min-height:380px;border-radius:0;z-index:1}
.leaflet-popup-content{font:14px Inter,sans-serif;margin:10px 12px}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content button{margin-top:6px;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.mk{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:14px}
.mk span{transform:rotate(45deg)}
/* accordions in more */
.acc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.acc>button{width:100%;text-align:left;background:none;border:0;padding:14px 16px;font-size:16px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.acc>button::after{content:"›";font-size:22px;color:var(--mute);transition:transform .2s}
.acc.open>button::after{transform:rotate(90deg)}
.acc>div{display:none;padding:0 16px 14px;font-size:14px}
.acc.open>div{display:block}
.acc table{width:100%;border-collapse:collapse;font-size:13px}
.acc td,.acc th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.acc th{color:var(--mute);font-weight:600}
/* checklist */
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck:last-child{border:0}
.ck input{width:22px;height:22px;accent-color:var(--teal);flex:0 0 22px}
.ck.done label{text-decoration:line-through;color:var(--mute)}
/* budget */
.bud .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.bud .item:last-child{border:0}
.bud .item input{width:22px;height:22px;accent-color:var(--teal)}
.bud .item .nm{flex:1}
.bud .item .v{font-weight:700;white-space:nowrap}
.bud .tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:10px 0 0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* phrases */
.ph{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ph:last-child{border:0}
.ph b{font-size:15px}
.ph i{color:var(--mute);font-size:13px}
/* lightbox */
.lb{position:fixed;inset:0;background:#000;z-index:120;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .c{position:absolute;bottom:calc(16px + var(--sab));left:0;right:0;text-align:center;color:#ccc;font-size:12px;padding:0 16px}
/* misc */
.pill{display:inline-block;background:var(--sea);color:var(--teal);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.pill.red{background:#fbe9ec;color:var(--red)}
.pill.gold{background:#fbf1dc;color:#8a6414}
.warn{background:#fff6e0;border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
:root[data-theme="dark"] .warn{background:#2a2410}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:20px 16px 10px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:10px 0 4px}
.count{display:flex;gap:6px;justify-content:center;margin:6px 0}
.count div{background:var(--navy);color:#fff;border-radius:10px;padding:6px 10px;text-align:center;min-width:58px}
.count b{display:block;font-size:20px}
.count span{font-size:10px;opacity:.75}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div><h1 id="topTitle">Истанбул 8</h1><small id="topSub">2026.10.13–19 · Истанбул + Каппадоки</small></div>
  <div><button class="ib" id="themeBtn" title="Харанхуй/гэрэл">◐</button></div>
</header>

<main>
  <section id="v-home" class="view on"><div class="wrap" id="c-home"></div></section>
  <section id="v-days" class="view"><div class="chips" id="dayChips"></div><div class="wrap" id="c-day"></div></section>
  <section id="v-places" class="view"><div class="chips" id="catChips"></div><div class="wrap"><input class="search" id="q" placeholder="Хайх: Ая София, kumpir, трам…"><div class="grid" id="c-places"></div></div></section>
  <section id="v-map" class="view"><div class="chips" id="mapChips"></div><div id="mapEl"></div><div class="wrap sub" style="padding:8px 16px">📍 тэмдэг дарж дэлгэрэнгүй. ⌖ товч: миний байршил.</div></section>
  <section id="v-more" class="view"><div class="wrap" id="c-more"></div></section>
</main>

<nav class="nav">
  <button data-v="home" class="on"><span>🏠</span>Нүүр</button>
  <button data-v="days"><span>📅</span>Өдрүүд</button>
  <button data-v="places"><span>📍</span>Газрууд</button>
  <button data-v="map"><span>🗺️</span>Зураг</button>
  <button data-v="more"><span>☰</span>Бусад</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="lb" id="lb"><img id="lbImg" alt=""><div class="c" id="lbCap"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="credits.js"></script>
<script src="app.js"></script>
</body>
</html>
